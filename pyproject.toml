[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "careermatch"
version = "0.1.0"
description = "CV analysis and explainable job recommendations"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
